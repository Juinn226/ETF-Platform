name: Update README Activity

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0

      - name: Generate recent activity section
        id: activity
        run: |
          set -euo pipefail
          echo "Collecting the latest 5 commits via git log"
          {
            echo "_Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo ""
            git log -5 --pretty=format:'- [`%h`](https://github.com/${{ github.repository }}/commit/%H) %s _(%an, %ad)_' --date=short
            echo ""
          } > activity_block.md

      - name: Splice activity into README between markers
        run: |
          python3 - <<'PY'
          import re, pathlib
          start = '<!-- RECENT_ACTIVITY:START -->'
          end = '<!-- RECENT_ACTIVITY:END -->'
          readme = pathlib.Path('README.md').read_text(encoding='utf-8')
          block = pathlib.Path('activity_block.md').read_text(encoding='utf-8').rstrip()
          new_section = start + chr(10) + block + chr(10) + end
          pattern = re.compile(re.escape(start) + '.*?' + re.escape(end), re.DOTALL)
          if not pattern.search(readme):
              raise SystemExit('Activity markers not found in README.md')
          updated = pattern.sub(new_section, readme)
          if updated != readme:
              pathlib.Path('README.md').write_text(updated, encoding='utf-8')
              print('README updated')
          else:
              print('No changes needed')
          PY

      - name: Commit and push if README changed
        run: |
          rm -f activity_block.md
          if git diff --quiet -- README.md; then
            echo 'No README changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: auto-update recent activity [skip ci]'
          git push
