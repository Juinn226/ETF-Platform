name: Preview README Activity

# Outstanding: on every PR, render a preview of the activity block and
# post it as a sticky PR comment + job summary (no write to repo).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build activity preview
        id: preview
        run: |
          set -euo pipefail
          {
            echo 'PREVIEW<<EOF'
            git log -5 --pretty=format:'- [`%h`](https://github.com/${{ github.repository }}/commit/%H) %s _(%an, %ad)_' --date=short
            echo ''
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Write preview to job summary
        run: |
          echo '### README activity preview' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.preview.outputs.PREVIEW }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW: ${{ steps.preview.outputs.PREVIEW }}
        with:
          script: |
            const marker = '<!-- readme-activity-preview -->';
            const preview = process.env.PREVIEW || '(no preview)';
            const body = `${marker}\n## README activity preview\n\nThis is how the auto-updated section will look after merge:\n\n${preview}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
